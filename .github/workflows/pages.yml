# Testet alles, veröffentlicht die Demo (Ordner public/) auf GitHub Pages und baut das Paket für World4You.
# Einmalig in GitHub: Settings → Pages → Source: "GitHub Actions".
name: Tests, Demo und Paket

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, curl, openssl
          coverage: none
      - run: npm test

  # Paket zum Hochladen auf World4You (unter Actions -> dieser Lauf -> Artifacts herunterladen)
  world4you:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/world4you-paket.sh "${GITHUB_SHA::8}"
      - uses: actions/upload-artifact@v4
        with:
          name: honorarnoten-world4you
          path: dist/world4you/
          include-hidden-files: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Versionsnummer an JS/CSS anhängen, damit Browser nach einem Update
      # nicht mehr die alten Dateien aus dem Cache verwenden.
      - run: scripts/cache-bust.sh public "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
